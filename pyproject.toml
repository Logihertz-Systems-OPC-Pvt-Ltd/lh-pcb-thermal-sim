[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lh-pcb-thermal-sim"
version = "0.1.0"
description = "Multi-Layer PCB 2D Finite-Difference Thermal Simulator, Anisotropic Stackup Conductivity, IPC-2152 Trace Heating, and 10-Rule Posture Auditor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sameer Tawade", email = "ops@logihertz.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Security",
]

[project.scripts]
lh-pcb-thermal = "lh_pcb_thermal_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
