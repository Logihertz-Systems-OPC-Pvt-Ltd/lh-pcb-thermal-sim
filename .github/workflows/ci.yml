name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax Compilation Check
        run: |
          python3 -m py_compile src/lh_pcb_thermal_sim/*.py tests/test_pcb_thermal_sim.py

      - name: Run Test Suite
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: CLI Smoke Tests
        run: |
          python3 bin/lh-pcb-thermal --version
          python3 bin/lh-pcb-thermal --help
          python3 bin/lh-pcb-thermal scan fixtures/hardened_pcb_policy.json --format table
          python3 bin/lh-pcb-thermal scan fixtures/hardened_pcb_policy.json --format json
          python3 bin/lh-pcb-thermal scan fixtures/hardened_pcb_policy.json --format sarif
          python3 bin/lh-pcb-thermal simulate fixtures/sample_jetson_carrier_board.json --heatmap
          python3 bin/lh-pcb-thermal calc-stackup fixtures/sample_jetson_carrier_board.json
          python3 bin/lh-pcb-thermal ipc2152 --current-amps 10.0 --width-mm 3.0
